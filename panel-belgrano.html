<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Técnico | Service Hogar Belgrano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --marino:#13294B; --oro:#E9A31B; --nieve:#F2F4F8; --blanco:#FFFFFF;
    --tinta:#0E1A2E; --gris:#556074; --linea:#D5DBE5; --wa:#147A3F;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--nieve);color:var(--tinta);font:400 17px/1.55 "Barlow",sans-serif;padding:30px 0}
  h1,h2,h3{font-family:"Barlow Condensed","Barlow",sans-serif;line-height:1.05;margin:0}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:20px;margin:0 0 14px}
  #app .v{display:none}#app .v.on{display:block}
  #app h2{font-size:28px;margin:0 0 8px}
  #app small{color:var(--gris)}
  #app label{font-size:14px;color:var(--gris);margin:10px 0 4px;display:block;font-weight:600}
  #app input, #app select, #app textarea{width:100%;font:400 16px/1.4 "Barlow",sans-serif;color:var(--tinta);padding:12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff}
  #app button{margin:12px 8px 0 0;padding:13px 18px;border:0;border-radius:12px;background:var(--oro);color:var(--marino);font:700 17px/1.2 "Barlow",sans-serif;cursor:pointer}
  #app button.d{background:#B3261E;color:#fff}
  #app button.s{background:transparent;color:var(--marino);border:2px solid var(--marino)}
  #app .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #app .lk{color:var(--marino);cursor:pointer;text-decoration:underline;font-weight:600}
  #app .ok{color:var(--wa)}#app .bad{color:#B3261E}
  #app .key{font:800 34px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;text-align:center;padding:14px;border:2px dashed var(--oro);border-radius:12px}
  #app .it{padding:10px 0;border-bottom:1px solid var(--linea);cursor:pointer}#app .it:last-child{border:0}
  #app button:disabled{opacity:.4;cursor:default}
  #app button.bio{width:100%;margin:0 0 14px;background:var(--marino);color:#fff}
  #app #ld{display:none;position:sticky;top:0;z-index:5;background:var(--oro);color:var(--marino);font-weight:700;text-align:center;padding:8px;border-radius:10px;margin-bottom:10px}
  .pwbox{position:relative}
  .sr{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
  #app .pwbox input{padding-right:52px}
  #app .pwbox .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin:0;padding:9px;background:transparent;color:var(--gris);border:0;border-radius:8px;line-height:0;display:flex;cursor:pointer}
  #app .pwbox .ojo[aria-pressed="true"]{color:var(--marino)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel de Administración</h1>
  <div id="app">
    <div id="ld">Cargando…</div>

    <div class="v on" id="alog">
      <div class="card">
        <h2>Acceso técnico</h2>
        <button type="button" id="bio" class="bio" style="display:none">🔐 Entrar con huella / Face ID</button>
        <form id="flog" autocomplete="on">
          <input class="sr" type="text" id="usr" name="username" value="tecnico" autocomplete="username" tabindex="-1" aria-hidden="true">
          <label for="pw">Contraseña</label>
          <div class="pwbox">
            <input id="pw" name="password" type="password" autocomplete="current-password">
            <button type="button" id="ver" class="ojo" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <button type="submit" id="ba">Entrar</button>
        </form>
      </div>
    </div>

    <div class="v" id="adm">
      <div class="card">
        <h2>Equipos</h2>
        <input id="q" placeholder="Buscar por clave, cliente, equipo o marca">
        <button id="bq">Actualizar</button><button class="s" id="bn">+ Nuevo equipo</button>
        <div id="lst" style="margin-top:10px"></div>
        <div id="bioset" style="display:none;margin-top:16px"><span class="lk" id="bioact"></span></div>
      </div>
    </div>

    <div class="v" id="eq"></div>
  </div>
</div>

<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbwTp6vLxClVClJ10mtN99URYymwLQ2TIlppeHxueZec-Xk2slxhg8lbnl3leiwOzYsR/exec";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt=d=>d?String(d).split('-').reverse().join('/'):'';
  let pend=0;
  
  const run=async(fn,...args)=>{
    pend++;$('ld').style.display='block';
    try{
      let r;try{r=await fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}
      catch(e){throw new Error('No se pudo conectar. Revisá tu internet y probá de nuevo.')}
      const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data;
    }finally{pend--;if(!pend)$('ld').style.display='none'}
  };
  
  fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'ping',args:[]})}).catch(()=>{});
  const show=id=>{document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id===id))};
  const guard=async f=>{try{await f()}catch(e){alert(e.message||e)}};

  const TIPOS=['Reparación','Mantenimiento preventivo','Instalación','Cambio de repuesto','Diagnóstico'];
  let PASS='',CUR=null,EDS=null;
  let DB={equipos:[],services:[]},Q=Promise.resolve();
  const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const cargar=async()=>{DB=await run('admin_todo',PASS)};
  const fichaLocal=k=>{const n=norm(k);return{equipo:Object.assign({},DB.equipos.find(e=>norm(e.clave)===n)),services:DB.services.filter(s=>norm(s.clave)===n).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))}};
  
  const bg=(fn,...a)=>{Q=Q.then(()=>run(fn,...a)).catch(async e=>{alert('No se pudo guardar ('+(e.message||e)+'). Se vuelven a cargar los datos.');try{await cargar()}catch(_){}})};
  
  const entrar=p=>guard(async()=>{PASS=p;DB=await run('admin_todo',PASS);$('pw').value='';verPw(false);lista();show('adm');bioUI()});
  $('ba').onclick=()=>entrar($('pw').value);
  $('flog').onsubmit=e=>e.preventDefault();

  const BIO_KEY='sh_bio';let BIO_OK=false,BIO_PEND=null;
  const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
  const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
  const bioGet=()=>{try{return JSON.parse(localStorage.getItem(BIO_KEY)||'null')}catch(_){return null}};
  function bioUI(){
    const on=!!bioGet();
    $('bio').style.display=(BIO_OK&&on)?'':'none';
    $('bioset').style.display=(BIO_OK&&PASS)?'':'none';
    $('bioact').textContent=on?'🔐 Desactivar huella / Face ID en este dispositivo':(BIO_PEND?'🔐 Tocá acá para confirmar con huella / Face ID':'🔐 Activar huella / Face ID en este dispositivo');
  }
  (async()=>{try{BIO_OK=!!(window.PublicKeyCredential&&window.crypto&&crypto.subtle&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(_){BIO_OK=false}bioUI()})();
  const bioGuard=f=>guard(async()=>{try{await f()}catch(e){if(e&&(e.name==='NotAllowedError'||e.name==='AbortError'))return;throw e}});
  const aesKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
  const prfClave=async(cid,salt)=>{
    const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
      allowCredentials:[{type:'public-key',id:ub64(cid)}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
    const r=a.getClientExtensionResults().prf;
    if(!r||!r.results||!r.results.first)throw new Error('Este dispositivo no permite entrar con huella de forma segura.');
    return aesKey(r.results.first);
  };
  const bioGuardar=async(cid,salt,key)=>{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(PASS));
    localStorage.setItem(BIO_KEY,JSON.stringify({cid,salt:b64(salt),iv:b64(iv),ct:b64(ct)}));
    BIO_PEND=null;
  };
  async function bioActivar(){
    if(BIO_PEND){const p=BIO_PEND;await bioGuardar(p.cid,p.salt,await prfClave(p.cid,p.salt));return}
    const salt=crypto.getRandomValues(new Uint8Array(32));
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'Service Hogar Belgrano',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'tecnico',displayName:'Técnico'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'required',userVerification:'required'},
      timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
    const ex=cred.getClientExtensionResults().prf;
    if(!ex||!ex.enabled)throw new Error('Este dispositivo no permite guardar la contraseña con huella de forma segura.');
    const cid=b64(cred.rawId);
    if(ex.results&&ex.results.first){await bioGuardar(cid,salt,await aesKey(ex.results.first));return}
    BIO_PEND={cid,salt};
    alert('Casi listo: tocá otra vez "Confirmar con huella / Face ID" para terminar.');
  }
  $('bioact').onclick=()=>bioGuard(async()=>{
    if(bioGet()){if(confirm('¿Desactivar el ingreso con huella / Face ID en este dispositivo?')){localStorage.removeItem(BIO_KEY);BIO_PEND=null;alert('Desactivado.')}}
    else{await bioActivar();if(bioGet())alert('Listo. La próxima vez podés entrar con huella / Face ID.')}
    bioUI()
  });
  $('bio').onclick=()=>bioGuard(async()=>{
    const d=bioGet();if(!d)return;
    const key=await prfClave(d.cid,ub64(d.salt));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(d.iv)},key,ub64(d.ct));
    await entrar(new TextDecoder().decode(pt))
  });

  const OJO_ON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',OJO_OFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  const verPw=m=>{const p=$('pw'),b=$('ver');p.type=m?'text':'password';b.innerHTML=m?OJO_OFF:OJO_ON;b.setAttribute('aria-pressed',m?'true':'false');b.setAttribute('aria-label',m?'Ocultar contraseña':'Mostrar contraseña')};
  $('ver').onclick=()=>{verPw($('pw').type==='password');$('pw').focus()};
  
  function lista(){
    const q=$('q').value.toLowerCase();
    const r=DB.equipos.filter(e=>!q||[e.clave,e.cliente,e.telefono,e.direccion,e.equipo,e.marca,e.modelo].join(' ').toLowerCase().includes(q)).slice().reverse().slice(0,50);
    $('lst').innerHTML=r.length?r.map(e=>'<div class="it" data-k="'+esc(e.clave)+'"><b>'+esc(e.clave)+'</b> · '+esc(e.equipo)+' '+esc(e.marca)+'<br><small>'+esc(e.cliente)+(e.direccion?' · '+esc(e.direccion):'')+'</small></div>').join(''):'<small>Sin resultados.</small>';
    $('lst').querySelectorAll('.it').forEach(el=>el.onclick=()=>abrir(el.dataset.k));
  }
  $('q').oninput=lista;
  $('bq').onclick=()=>guard(async()=>{await cargar();lista()});
  $('bn').onclick=()=>{CUR={equipo:{},services:[]};EDS=null;pintar()};
  function abrir(k){CUR=fichaLocal(k);EDS=null;pintar()}

  function pintar(){
    const e=CUR.equipo,has=!!e.clave;
    const hoy=new Date().toISOString().slice(0,10);
    $('eq').innerHTML=(has?'<div class="card"><small>Clave para escribir en el sticker</small><div class="key">'+esc(e.clave)+'</div></div>':'')+
    '<div class="card"><h2>'+(has?'Datos del equipo':'Nuevo equipo')+'</h2>'+
    '<small>El teléfono y la dirección solo los ves vos. El cliente ve su nombre.</small>'+
    '<label>Cliente (nombre)</label><input id="e_cliente" value="'+esc(e.cliente)+'">'+
    '<div class="row"><div><label>Teléfono</label><input id="e_telefono" type="tel" value="'+esc(e.telefono)+'"></div><div><label>Dirección</label><input id="e_direccion" value="'+esc(e.direccion)+'"></div></div>'+
    '<div class="row"><div><label>Equipo</label><input id="e_equipo" value="'+esc(e.equipo)+'" placeholder="Lavarropas"></div><div><label>Marca</label><input id="e_marca" value="'+esc(e.marca)+'"></div></div>'+
    '<div class="row"><div><label>Modelo</label><input id="e_modelo" value="'+esc(e.modelo)+'"></div><div><label>N° de serie</label><input id="e_serie" value="'+esc(e.serie)+'"></div></div>'+
    '<button id="se">'+(has?'Guardar datos':'Crear y generar clave')+'</button><button class="s" id="vl">← Lista</button>'+(has?'<button class="d" id="de">Borrar equipo</button>':'')+'</div>'+
    (has?'<div class="card"><h2>Services</h2><div id="sl"></div></div>'+
    '<div class="card" id="sf"><h2 id="sft">Agregar service</h2><div class="row"><div><label>Fecha</label><input id="s_fecha" type="date" value="'+hoy+'"></div><div><label>Garantía (días)</label><input id="s_gar" type="number" value="90"></div></div>'+
    '<label>Tipo</label><select id="s_tipo">'+TIPOS.map(t=>'<option>'+t+'</option>').join('')+'</select>'+
    '<label>Detalle del trabajo</label><textarea id="s_det" rows="3"></textarea><label>Repuestos</label><input id="s_rep"><label>Técnico</label><input id="s_tec" list="tecs" placeholder="Elegí o escribí"><datalist id="tecs"><option value="Bruno"><option value="Mauricio"></datalist>'+
    '<button id="ss">Agregar service</button><button class="s" id="sc" style="display:none">Cancelar edición</button></div>':'');
    show('eq');
    $('vl').onclick=()=>guard(async()=>{await lista();show('adm')});
    
    if(has)$('de').onclick=()=>{
      const n=CUR.services.length;
      if(!confirm('¿Borrar el equipo '+e.clave+(e.cliente?' ('+e.cliente+')':'')+' y sus '+n+' service(s)?\nEsto no se puede deshacer.'))return;
      DB.equipos=DB.equipos.filter(x=>x.clave!==e.clave);DB.services=DB.services.filter(x=>norm(x.clave)!==norm(e.clave));
      bg('admin_delEquipo',PASS,e.clave);lista();show('adm')
    };
    
    $('se').onclick=()=>guard(async()=>{
      const d={};['cliente','telefono','direccion','equipo','marca','modelo','serie'].forEach(k=>d[k]=$('e_'+k).value.trim());
      if(has){Object.assign(DB.equipos.find(x=>x.clave===e.clave),d);bg('admin_editEquipo',PASS,e.clave,d);CUR=fichaLocal(e.clave);EDS=null;pintar();alert('Datos guardados')}
      else{if(!d.equipo){alert('Indicá el equipo');return}const n=await run('admin_crear',PASS,d);DB.equipos.push(n.equipo);CUR=fichaLocal(n.equipo.clave);EDS=null;pintar()}
    });
    
    if(!has)return;
    $('ss').onclick=()=>guard(async()=>{
      const s={fecha:$('s_fecha').value,tipo:$('s_tipo').value,detalle:$('s_det').value.trim(),repuestos:$('s_rep').value.trim(),garantia:$('s_gar').value,tecnico:$('s_tec').value.trim()};
      if(!s.fecha){alert('Indicá la fecha');return}
      if(EDS){Object.assign(DB.services.find(x=>x.id===EDS),s);bg('admin_editService',PASS,EDS,s)}
      else{s.id=Math.random().toString(36).slice(2,10);DB.services.push(Object.assign({},s,{clave:e.clave}));bg('admin_addService',PASS,e.clave,s)}
      CUR=fichaLocal(e.clave);EDS=null;pintar()
    });
    $('sc').onclick=()=>{EDS=null;pintar()};
    
    const filaT=s=>'<div class="it" style="cursor:default"><b>'+fmt(s.fecha)+'</b> · '+esc(s.tipo)+' · '+s.garantia+' d<br><small>'+esc(s.detalle)+'</small><br><span class="lk" data-ed="'+esc(s.id)+'">Editar</span> &nbsp; <span class="lk bad" data-del="'+esc(s.id)+'">Borrar</span></div>';
    
    function pintarSvc(){
      const L=CUR.services.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
      let h = (!L.length) ? '<small>Todavía no hay services.</small>' : L.map(filaT).join('');
      $('sl').innerHTML=h;
    }
    $('sl').onclick=ev=>{
      const t=ev.target.closest('[data-ed],[data-del]');if(!t||t.disabled)return;
      if(t.dataset.ed){
        const s=CUR.services.find(x=>x.id===t.dataset.ed);EDS=s.id;
        $('s_fecha').value=s.fecha;$('s_gar').value=s.garantia;$('s_tipo').value=s.tipo;$('s_det').value=s.detalle;$('s_rep').value=s.repuestos;$('s_tec').value=s.tecnico;
        $('sft').textContent='Editando service';$('ss').textContent='Guardar cambios';$('sc').style.display='';$('sf').scrollIntoView();return
      }
      if(t.dataset.del){
        const id=t.dataset.del;
        if(confirm('¿Borrar este service?'))guard(async()=>{DB.services=DB.services.filter(x=>x.id!==id);bg('admin_delService',PASS,id);CUR=fichaLocal(e.clave);EDS=null;pintar()})
      }
    };
    pintarSvc();
  }
</script>
</body>
</html>
