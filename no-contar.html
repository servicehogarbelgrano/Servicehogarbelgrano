<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>No contar este dispositivo</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#EEF0F2;color:#23272B;font:17px/1.5 system-ui,sans-serif;text-align:center}
main{max-width:420px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}
p{margin:0 0 18px}
button{font:inherit;font-weight:600;padding:12px 18px;border:1px solid #23272B;border-radius:8px;background:#fff;color:#23272B;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <button id="cambiar" type="button"></button>
</main>
<script>
  var CLAVE = "no-contar";
  function mostrar(excluido, guardado) {
    document.getElementById("titulo").textContent = !guardado ? "No se pudo guardar" : excluido ? "Este dispositivo ya no se cuenta" : "Este dispositivo vuelve a contarse";
    document.getElementById("texto").textContent = !guardado ? "Este navegador no permite guardar la marca. Probá sin modo incógnito." : excluido ? "Tus entradas desde este navegador no van a sumar en las estadísticas de la página." : "Tus entradas desde este navegador vuelven a sumar en las estadísticas.";
    document.getElementById("cambiar").textContent = excluido ? "Volver a contarlo" : "No contarlo";
    document.getElementById("cambiar").hidden = !guardado;
  }
  function marcar(excluido) {
    try {
      if (excluido) localStorage.setItem(CLAVE, "1"); else localStorage.removeItem(CLAVE);
      mostrar(excluido, true);
    } catch (e) { mostrar(excluido, false); }
  }
  var actual = true;
  document.getElementById("cambiar").addEventListener("click", function () { actual = !actual; marcar(actual); });
  marcar(true);
</script>
</body>
</html>
