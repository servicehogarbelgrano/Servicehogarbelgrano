<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de tu equipo | Service Hogar Belgrano</title>
<meta name="description" content="Consultá el historial de service y la garantía de tu equipo con la clave del sticker.">
<link rel="icon" type="image/png" sizes="192x192" href="https://servicehogarbelgrano.com.ar/favicon.png">
<link rel="apple-touch-icon" href="https://servicehogarbelgrano.com.ar/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --marino:#13294B; --oro:#E9A31B; --nieve:#F2F4F8; --blanco:#FFFFFF;
    --tinta:#0E1A2E; --gris:#556074; --linea:#D5DBE5; --wa:#147A3F;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--nieve);color:var(--tinta);
       font:400 17px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
       padding-bottom:88px;-webkit-text-size-adjust:100%}
  h1,h2,h3{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;line-height:1.05;margin:0}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  :focus-visible{outline:3px solid var(--oro);outline-offset:3px}
  .hero{color:#fff;padding:20px 0 84px;position:relative;
         background:radial-gradient(circle at 88% 12%,rgba(233,163,27,.28),transparent 42%),
           repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),
           linear-gradient(135deg,#13294B 0%,#1B3A6B 55%,#2A5190 100%)}
  .hero.con-foto{background:linear-gradient(135deg,rgba(19,41,75,.90) 0%,rgba(19,41,75,.76) 55%,rgba(19,41,75,.55) 100%),
           url("hero.jpg") 6% 28%/cover no-repeat,var(--marino)}
  .hero::before,.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px}
  .hero::before{height:64px;background:var(--oro);clip-path:polygon(0 100%,100% 0,100% 100%)}
  .hero::after{height:46px;background:var(--nieve);clip-path:polygon(0 100%,100% 0,100% 100%)}
  .marca{display:flex;align-items:center;gap:12px;margin-bottom:32px}
  .logo{width:56px;height:56px;border-radius:50%;background:#fff;object-fit:contain;padding:3px;border:2px solid var(--oro);flex:none}
  .marca strong{display:block;font:800 23px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
  .marca span{font-size:14px;color:#BFCADD}
  .hero .kicker{margin:0 0 12px;font:700 14px/1.2 "Barlow",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);max-width:none}
  .hero h1{font-size:clamp(38px,10.5vw,60px);font-weight:800;max-width:15ch;margin-bottom:16px}
  .hero h1 em{font-style:normal;color:var(--oro)}
  .hero p{margin:0 0 24px;font-size:19px;color:#DCE4F1;max-width:34ch}
  .solapa{margin-left:auto;text-decoration:none;font:700 15px/1 "Barlow",sans-serif;color:#fff;border:2px solid var(--oro);border-radius:999px;padding:10px 16px;white-space:nowrap;transition:background .2s,color .2s}
  .solapa:hover{background:var(--oro);color:var(--marino)}
  section{padding:32px 0}
  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:20px;margin:0 0 14px}
  #app .v{display:none}#app .v.on{display:block}
  #app h2{font-size:28px;margin:0 0 8px}
  #app small{color:var(--gris)}
  #app label{font-size:14px;color:var(--gris);margin:10px 0 4px;display:block;font-weight:600}
  #app input{width:100%;font:400 16px/1.4 "Barlow",sans-serif;color:var(--tinta);padding:12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff}
  #app button{margin:12px 8px 0 0;padding:13px 18px;border:0;border-radius:12px;background:var(--oro);color:var(--marino);font:700 17px/1.2 "Barlow",sans-serif;cursor:pointer}
  #app button.s{background:transparent;color:var(--marino);border:2px solid var(--marino)}
  #app .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--linea)}
  #app .kv:last-child{border:0}#app .kv span:first-child{color:var(--gris)}#app .kv span:last-child{text-align:right;font-weight:600}
  #app .b{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;border:2px solid currentColor}
  #app .ok{color:var(--wa)}#app .bad{color:#B3261E}
  #app .it{padding:10px 0;border-bottom:1px solid var(--linea);cursor:pointer}#app .it:last-child{border:0}
  #app .vall{width:100%;margin:4px 0 14px}
  #app .pag{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
  #app .pag button{margin:0;padding:11px 12px;font-size:16px}
  #app .pag span{color:var(--gris);font-weight:600;font-size:15px;text-align:center}
  #app #ld{display:none;position:sticky;top:0;z-index:5;background:var(--oro);color:var(--marino);font-weight:700;text-align:center;padding:8px;border-radius:10px;margin-bottom:10px}
  .barra{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:10}
  .barra div{max-width:720px;margin:0 auto;display:flex;gap:10px}
  .barra .btn{flex:1;padding:13px 8px;font-size:16px;text-align:center;text-decoration:none;font:700 18px/1.2 "Barlow",sans-serif;border-radius:12px;background:var(--wa);color:#fff}
</style>
</head>
<body>
<header class="hero chico">
  <div class="wrap">
    <div class="marca">
      <img class="logo" src="logo.png" alt="Logo de Service Hogar Belgrano" onerror="this.style.display='none'">
      <div>
        <strong>Service Hogar Belgrano</strong>
        <span>Servicio técnico de electrodomésticos</span>
      </div>
      <a class="solapa" href="index.html">← Inicio</a>
    </div>
    <p class="kicker">Historial y garantía</p>
    <h1>Ficha de <em>tu equipo</em></h1>
    <p>Ingresá la clave que escribimos a mano en el sticker de tu equipo.</p>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div id="app">
        <div id="ld">Cargando…</div>
        <div class="v on" id="login">
          <div class="card">
            <h2>Ficha de tu equipo</h2><small>Ingresá la clave escrita en el sticker.</small>
            <label>Clave</label>
            <input id="cl" placeholder="Ej: K7M-4PX" autocapitalize="characters" autocomplete="off">
            <button id="bc">Ver ficha</button>
          </div>
        </div>
        <div class="v" id="ficha">
          <div id="fv"></div>
          <button class="s" id="back1">← Volver</button>
        </div>
      </div>
      <noscript><p>Necesitás activar JavaScript para ver tu ficha.</p></noscript>
    </div>
  </section>
</main>

<nav class="barra" aria-label="Contacto rápido">
  <div>
    <a class="btn" href="https://wa.me/5491167489192?text=Hola%2C%20consulto%20por%20la%20ficha%20de%20mi%20equipo.">WhatsApp Bruno</a>
    <a class="btn" href="https://wa.me/5491165711314?text=Hola%2C%20consulto%20por%20la%20ficha%20de%20mi%20equipo.">WhatsApp Mauricio</a>
  </div>
</nav>

<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbwTp6vLxClVClJ10mtN99URYymwLQ2TIlppeHxueZec-Xk2slxhg8lbnl3leiwOzYsR/exec";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt=d=>d?String(d).split('-').reverse().join('/'):'';
  let pend=0;
  
  const run=async(fn,...args)=>{
    pend++;$('ld').style.display='block';
    try{
      let r;try{r=await fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}
      catch(e){throw new Error('No se pudo conectar. Revisá tu internet y probá de nuevo.')}
      const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data;
    }finally{pend--;if(!pend)$('ld').style.display='none'}
  };
  
  fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'ping',args:[]})}).catch(()=>{});
  const show=id=>{document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id===id))};
  const guard=async f=>{try{await f()}catch(e){alert(e.message||e)}};
  
  function venc(s){const d=new Date(s.fecha+'T12:00:00');d.setDate(d.getDate()+(+s.garantia||0));return d}
  function vigente(s){return venc(s)>=new Date()}

  let FF=null,FMODE='res',FPAG=0;
  const PORPAG=20,ULT=5;
  const dsvc=s=>(s.detalle?'<div class="kv"><span>Detalle</span><span>'+esc(s.detalle)+'</span></div>':'')+
    (s.repuestos?'<div class="kv"><span>Repuestos</span><span>'+esc(s.repuestos)+'</span></div>':'')+
    (s.tecnico?'<div class="kv"><span>Técnico</span><span>'+esc(s.tecnico)+'</span></div>':'');
  const garS=s=>s.garantia+' días · vence '+venc(s).toLocaleDateString('es-AR');
  const cardSvc=s=>'<div class="card"><div class="kv"><span>Fecha</span><span>'+fmt(s.fecha)+'</span></div>'+
    '<div class="kv"><span>Trabajo</span><span>'+esc(s.tipo)+'</span></div>'+dsvc(s)+
    '<div class="kv"><span>Garantía</span><span class="'+(vigente(s)?'ok':'bad')+'">'+garS(s)+'</span></div></div>';
  const filaSvc=s=>'<div class="it" style="cursor:default"><b>'+fmt(s.fecha)+'</b> · '+esc(s.tipo)+
    (s.detalle?'<br><small>'+esc(s.detalle)+'</small>':'')+
    (s.repuestos?'<br><small>Repuestos: '+esc(s.repuestos)+'</small>':'')+
    (s.tecnico?'<br><small>Técnico: '+esc(s.tecnico)+'</small>':'')+
    '<br><small class="'+(vigente(s)?'ok':'bad')+'">Garantía: '+garS(s)+'</small></div>';
    
  function pintarFicha(){
    const f=FF,e=f.equipo;
    const L=f.services.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const any=L.some(vigente),pags=Math.max(1,Math.ceil(L.length/PORPAG));
    FPAG=Math.min(Math.max(FPAG,0),pags-1);
    let h='<div class="card"><h2>'+esc(e.equipo)+' '+esc(e.marca)+' '+esc(e.modelo)+'</h2>'+
      (e.cliente?'<small>Cliente: '+esc(e.cliente)+'</small><br>':'')+
      (e.serie?'<small>N° de serie: '+esc(e.serie)+'</small><br>':'')+
      (L.length?'<span class="b '+(any?'ok':'bad')+'">'+(any?'✔ Garantía vigente':'Garantía vencida')+'</span>':'<small>Sin services registrados.</small>')+'</div>';
    
    if(FMODE==='res'||L.length<=ULT){
      h+=L.slice(0,ULT).map(cardSvc).join('');
      if(L.length>ULT)h+='<button type="button" class="s vall" data-acc="all">Ver lista completa ('+L.length+' services)</button>';
    }else{
      h+='<div class="card"><h2>Lista completa</h2><small>'+L.length+' services · del más reciente al más antiguo</small>'+
        L.slice(FPAG*PORPAG,(FPAG+1)*PORPAG).map(filaSvc).join('')+
        '<div class="pag"><button type="button" class="s" data-acc="prev"'+(FPAG===0?' disabled':'')+'>← Anterior</button>'+
        '<span>Página '+(FPAG+1)+' de '+pags+'</span>'+
        '<button type="button" class="s" data-acc="next"'+(FPAG>=pags-1?' disabled':'')+'>Siguiente →</button></div></div>'+
        '<button type="button" class="s vall" data-acc="res">Ver solo los últimos '+ULT+'</button>';
    }
    $('fv').innerHTML=h;
  }
  
  $('fv').onclick=ev=>{
    const b=ev.target.closest('[data-acc]');if(!b||b.disabled)return;
    const a=b.dataset.acc;
    if(a==='all'){FMODE='lista';FPAG=0}else if(a==='res'){FMODE='res'}else if(a==='prev'){FPAG--}else if(a==='next'){FPAG++}
    pintarFicha();window.scrollTo({top:0,behavior:'smooth'})
  };
  
  $('bc').onclick=()=>guard(async()=>{
    const f=await run('getFicha',$('cl').value);
    if(!f){alert('Clave no encontrada. Revisá cómo está escrita en el sticker.');return}
    FF=f;FMODE='res';FPAG=0;pintarFicha();
    show('ficha')
  });
  
  $('cl').onkeydown=e=>{if(e.key==='Enter')$('bc').click()};
  $('back1').onclick=()=>{$('cl').value='';FF=null;FMODE='res';FPAG=0;show('login')};
</script>
</body>
</html>
